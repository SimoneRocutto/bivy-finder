name: ci-test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    env:
      ATLAS_URI: ${{ secrets.ATLAS_URI }}
      ATLAS_DB: ${{ secrets.ATLAS_DB }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ACCESS_KEY_SECRET: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      AWS_BUCKET_DIRECTORY: ${{ secrets.AWS_BUCKET_DIRECTORY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      BASE_SERVER_URL: "http://localhost/"
      PORT: 5200
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup Node.js environment
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20.12.x"
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1.35.1
      - name: Client npm install
        run: npm install
      - name: Test client build
        run: npm run build
      - name: Launch client unit tests
        run: npm run test-ci
      - name: Server npm install
        run: npm install
        working-directory: server
      - name: Database seeding
        run: npm run db-seed
        working-directory: server
      - name: Cypress.io
        uses: cypress-io/github-action@v6.7.6
        with:
          browser: chrome
          working-directory: client
          start: npm run start-server, npm start

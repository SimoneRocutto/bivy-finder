networks:
  shared-network:
services:

  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
    networks:
      - shared-network

  server-dev:
    container_name: mc_server_dev
    develop:
      watch:
        - action: sync
          path: ./server
          target: /usr/src/server
          ignore:
            - node_modules/
        - action: rebuild
          path: ./server/package.json
    restart: unless-stopped
    image: mc-server-dev:1.0.0
    build:
      context: server
      dockerfile: Dockerfile
      target: development
    ports:
      - 5200:5200
    networks:
      - shared-network
    depends_on:
      redis:
        condition: service_started
    profiles:
      - dev

  client-dev:
    container_name: mc_client_dev
    develop:
      watch:
        - action: rebuild
          path: ./client/package.json
        - action: sync+restart
          path: ./client/angular.json
          target: /usr/src/client/angular.json
        - action: sync
          path: ./client
          target: /usr/src/client
          ignore:
            - node_modules/
    restart: unless-stopped
    image: mc-client-dev:1.0.0
    build:
      context: client
      dockerfile: Dockerfile
      target: development
    ports:
      - 4200:4200
    networks:
      - shared-network
    depends_on:
      server-dev:
        condition: service_started
    profiles:
      - dev

  server-prod:
    container_name: mc_server_prod
    restart: unless-stopped
    image: mc-server-prod:1.0.0
    build:
      context: server
      dockerfile: Dockerfile
      target: production
    ports:
      - 5200:5200
    networks:
      - shared-network
    depends_on:
      - redis
    profiles:
      - prod

  client-prod:
    container_name: mc_client_prod
    restart: unless-stopped
    image: mc-client-prod:1.0.0
    build:
      context: client
      dockerfile: Dockerfile
      target: production
    ports:
      - 80:80
    networks:
      - shared-network
    depends_on:
      - server-prod
    profiles:
      - prod
    environment:
      - ENVIRONMENT=${ENVIRONMENT}